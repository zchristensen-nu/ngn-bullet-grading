<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGN Daily Bullet Grading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one story per screen. Two newsletter modules side by side (stacked on phones); clicking one picks it. A tick strip of 18 stories along the top. */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#17181b; --muted:#62646b; --faint:#8b8d94;
  --rule:#e2e2df; --rule-strong:#cfcfcb; --accent:#c8102e; --accent-ink:#a50d26; --wash:#fbeef0;
  --tie:#5b6472; --tie-wash:#eef0f3; --ok:#2f6f4f;
  --paper:#ffffff; --ink-soft:#2b2d31; --shadow:rgba(20,22,28,.08);
  /* Diverging scale, Writers (blue) <-> Claude (red), gray midpoint. Each arm validated as a one-hue ramp. */
  --d2:#1f4e8c; --d1:#7d9cc8; --even:#cdccc6; --c1:#ea8494; --c2:#c8102e;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#18191c; --ink:#ececee; --muted:#a2a4ab; --faint:#7d7f86;
  --rule:#2a2c30; --rule-strong:#3a3c41; --accent:#e0485c; --accent-ink:#ececee; --wash:#2a181c;
  --tie:#a9b1be; --tie-wash:#22252a; --ok:#7cc4a0; --paper:#1b1c20; --ink-soft:#d6d7da; --shadow:rgba(0,0,0,.45); --d2:#9cbdf0; --d1:#4f6d99; --even:#3a3c41; --c1:#a8495a; --c2:#ff6b7d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#18191c; --ink:#ececee; --muted:#a2a4ab; --faint:#7d7f86;
  --rule:#2a2c30; --rule-strong:#3a3c41; --accent:#e0485c; --accent-ink:#ececee; --wash:#2a181c;
  --tie:#a9b1be; --tie-wash:#22252a; --ok:#7cc4a0; --paper:#1b1c20; --ink-soft:#d6d7da; --shadow:rgba(0,0,0,.45); --d2:#9cbdf0; --d1:#4f6d99; --even:#3a3c41; --c1:#a8495a; --c2:#ff6b7d; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.mono{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-variant-numeric:tabular-nums}

/* Masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:var(--s5);padding-block:var(--s3);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:var(--s3);margin-right:auto}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--muted)}
.ticks{display:flex;gap:3px;align-items:center}
.ticks button{width:14px;height:22px;border:0;padding:0;background:none;display:grid;place-items:end center}
.ticks button i{display:block;width:100%;height:6px;background:var(--rule-strong);border-radius:1px;transition:height .15s,background .15s}
.ticks button.done i{background:var(--ink)}
.ticks button.on i{height:16px}
.ticks button.on:not(.done) i{background:var(--accent)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4.5em;text-align:right}

/* Intro */
.intro{padding-block:var(--s7) var(--s5)}
.intro h1{font-weight:300;font-size:clamp(34px,5.4vw,56px);line-height:1.04;letter-spacing:-.025em;margin:0 0 var(--s4);text-wrap:balance;max-width:16ch}
.intro p{color:var(--muted);max-width:60ch;margin:0}
.intro .rule{width:56px;height:3px;background:var(--accent);margin-bottom:var(--s5)}

/* Story */
.story{padding-block:var(--s5) var(--s8)}
.slug{display:flex;gap:var(--s4);align-items:baseline;flex-wrap:wrap;color:var(--muted);margin-bottom:var(--s3)}
.slug .n{color:var(--ink);font-variant-numeric:tabular-nums}
.slug a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule-strong)}
.slug a:hover{color:var(--ink);border-color:var(--ink)}
.story > h2{font-weight:400;font-size:clamp(24px,3.3vw,34px);line-height:1.18;letter-spacing:-.015em;margin:0 0 var(--s6);text-wrap:balance;max-width:30ch}

/* Two newsletter story modules, rendered the way the daily lays them out */
.proofs{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
@media (max-width:760px){.proofs{grid-template-columns:1fr}}
.proof{min-width:0;display:flex;flex-direction:column;gap:var(--s3)}
.proof > header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:24px}
.letter{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.1em;color:var(--muted)}
.letter b{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border:1px solid var(--rule-strong);border-radius:50%;color:var(--ink);font-weight:500;letter-spacing:0}
.proof.picked .letter b{background:var(--accent);border-color:var(--accent);color:#fff}
.verdict-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;background:var(--wash);color:var(--accent-ink)}
.proof.tied .verdict-tag{background:var(--tie-wash);color:var(--tie)}
/* The story module is written to email limits: one ~600px column, system font stacks
   (Georgia for headlines, since Gmail and Outlook drop web fonts), native bullets,
   no shadows or rounded corners, plain text link for the call to action. */
.email{--e-ink:#1a1a1a;--e-body:#2e2e2e;--e-muted:#6e6e6e;--e-rule:#e4e4e4;
  background:#ffffff;color:var(--e-ink);border:1px solid var(--rule);max-width:600px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;transition:outline-color .15s}
.proof.picked .email{outline:2px solid var(--accent);outline-offset:4px}
.proof.tied .email{outline:2px solid var(--tie);outline-offset:4px}
.email figure{margin:0;aspect-ratio:2/1;background:var(--e-rule);overflow:hidden}
.email img{display:block;width:100%;height:100%;object-fit:cover;max-width:100%}
.email .body{padding:28px 32px 32px;display:flex;flex-direction:column;flex:1;font-family:Helvetica,Arial,sans-serif}
.email h3{margin:0;font-family:Georgia,"Times New Roman",Times,serif;font-weight:400;font-size:26px;line-height:1.22;letter-spacing:-.005em;color:var(--e-ink);text-wrap:balance}
.email .by{margin:10px 0 0;font-size:13px;line-height:1.4;color:var(--e-muted)}
.email ul{margin:22px 0 0;padding:0 0 0 20px;list-style:disc}
.email li{font-size:16px;line-height:1.55;color:var(--e-body);padding-left:2px}
.email li+li{margin-top:12px}
.email li::marker{color:var(--e-ink)}
.email li b{font-weight:700;color:var(--e-ink)}
.read{margin-top:auto;padding-top:26px;font-size:15px;font-weight:700;color:var(--e-ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;align-self:flex-start}
.read:hover{text-decoration-thickness:2px}
@media (max-width:560px){.email .body{padding:22px 20px 26px}.email h3{font-size:23px}}
.src{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-top:var(--s1)}
.src.claude{color:var(--ink)}

.proof.choosable{cursor:pointer}
.proof.choosable:not(.picked):hover .email{outline:2px solid var(--rule-strong);outline-offset:4px}
.choose{margin-top:var(--s3);width:100%;max-width:600px;align-self:center;padding:14px 18px;border:1.5px solid var(--ink);border-radius:3px;background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;transition:background .12s,color .12s}
.proof.choosable:not(.picked):hover .choose{background:var(--ink);color:var(--bg)}
.choose[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.even{display:flex;justify-content:center;margin-top:var(--s4)}
.even button{border:0;background:none;color:var(--muted);font-size:14.5px;text-decoration:underline;text-underline-offset:3px;padding:var(--s2)}
.even button:hover{color:var(--ink)}
.even button[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration:none}
.top .wrap{row-gap:var(--s2)}
@media (max-width:560px){.top .wrap{gap:var(--s2) var(--s4)}.brand{margin-right:0;flex:1 0 100%}.ticks{flex:1;min-width:0}.ticks button{flex:1;width:auto}}
#howto{border:0;border-radius:4px;padding:40px 40px 32px;max-width:min(460px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
#howto::backdrop{background:rgba(12,13,16,.55)}
#howto h2{margin:0 0 var(--s3);font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
#howto p{margin:0 0 var(--s5);color:var(--muted)}

.note{margin-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.note label{color:var(--muted)}
.note textarea{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:var(--s3)}
.note textarea:focus{border-color:var(--rule-strong);outline:none}

.nav{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s5);flex-wrap:wrap}
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:3px;padding:10px 16px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:disabled{opacity:.35;cursor:default}
.btn:disabled{cursor:default}
.status{margin-left:auto;color:var(--faint);font-size:13px}

/* Finish + results */
.finish{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:3px;padding:var(--s6);display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s6)}
.finish h3{margin:0;font-weight:400;font-size:24px;letter-spacing:-.01em}
.finish p{margin:0;color:var(--muted);max-width:60ch}
.results{padding-block:var(--s6) var(--s8);display:flex;flex-direction:column;gap:var(--s7)}
.results h2{font-weight:300;font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:20ch}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.score div{padding:var(--s4) var(--s4) var(--s4) 0;display:flex;flex-direction:column;gap:2px}
.score div+div{padding-left:var(--s4);border-left:1px solid var(--rule)}
.score strong{font-weight:300;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score span{color:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);border-bottom:1px solid var(--rule);padding-bottom:var(--s2);margin-bottom:var(--s2);flex-wrap:wrap}
.section-h h3{margin:0;font-weight:600;font-size:15px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:2.2em minmax(0,1fr) minmax(160px,260px);gap:var(--s4);align-items:center;padding-block:var(--s3);border-bottom:1px solid var(--rule)}
.row .n{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.row .h{min-width:0;font-size:15px;line-height:1.35}
.row .h button{border:0;background:none;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.pill{justify-self:end;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:2px;white-space:nowrap}
.pill.desk{background:var(--tie-wash);color:var(--ink)}
.pill.claude{background:var(--wash);color:var(--accent-ink)}
.pill.same{background:none;border:1px solid var(--rule-strong);color:var(--muted)}
.bar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--rule)}
.bar i{display:block;height:100%}
.bar .d{background:var(--ink)} .bar .t{background:var(--rule-strong)} .bar .c{background:var(--accent)}
.barcell{display:flex;flex-direction:column;gap:4px}
.barcell small{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.legend{display:flex;gap:var(--s4);color:var(--muted);font-size:13px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.empty{color:var(--muted);padding-block:var(--s4)}
@media (max-width:560px){.row{grid-template-columns:2em minmax(0,1fr)}.row .pill,.row .barcell{grid-column:2;justify-self:start}.barcell{width:100%}.score strong{font-size:34px}}
.toplink{border:1px solid var(--rule-strong);background:none;border-radius:3px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.toplink:hover{border-color:var(--ink)}
#who{border-color:transparent;color:var(--muted);font-weight:500}
#admin[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#howto form{display:flex;flex-direction:column;gap:var(--s2)}
#howto label{font-size:13px;font-weight:600}
#howto input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--surface);color:var(--ink)}
#howto input:focus{outline:2px solid var(--ink);outline-offset:1px}
#howto .err{margin:0;color:var(--accent-ink);font-size:13px}
#howto button{margin-top:var(--s3);align-self:flex-start}
.lede{margin:var(--s3) 0 0;color:var(--muted)}
.results > section{display:flex;flex-direction:column;gap:var(--s4)}
.you{padding-bottom:var(--s5);border-bottom:1px solid var(--ink)}
.hint{font-size:13px;color:var(--muted)}
.team{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule-strong);border-radius:2px;padding:1px 6px;vertical-align:2px}
.linkish{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.pill.skip{background:none;border:1px dashed var(--rule-strong);color:var(--faint)}
.verdict-tag.skip{background:var(--tie-wash);color:var(--muted)}
.proof.skipped .email{opacity:.55}
.even{gap:var(--s2);align-items:center;flex-wrap:wrap;color:var(--faint)}
#howto .teams{border:0;margin:var(--s3) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
#howto legend{font-size:13px;font-weight:600;padding:0;margin-bottom:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--rule-strong);border-radius:999px;font-size:14px;font-weight:500;transition:background .12s,border-color .12s}
.chip:hover span{border-color:var(--ink)}
.chip input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.xrow{border-bottom:1px solid var(--rule)}
.xrow > summary{list-style:none;cursor:pointer;border-bottom:0}
.xrow > summary::-webkit-details-marker{display:none}
.xrow > summary:hover .h{text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.row .h small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xbody{padding:0 0 var(--s4) calc(2.2em + var(--s4));overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 12px 6px 0;border-bottom:1px solid var(--rule)}
.ptable td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ptable td:first-child{white-space:nowrap}
.ptable td:last-child{min-width:16em;color:var(--ink-soft)}
.ptable .pill{justify-self:auto}
@media (max-width:560px){.xbody{padding-left:0}}
/* Five-step scale under the two versions */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:var(--s5);border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--surface)}
.scale button{border:0;border-left:1px solid var(--rule-strong);background:none;padding:12px 6px;font-weight:600;font-size:14.5px;line-height:1.25;text-align:center;transition:background .12s,color .12s}
.scale button:first-child{border-left:0}
.scale button small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.scale button:hover{background:var(--tie-wash)}
.scale button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.scale button[aria-checked="true"] small{color:inherit;opacity:.8}
.scale button[data-pick^="A"][aria-checked="true"],.scale button[data-pick^="B"][aria-checked="true"]{background:var(--accent);color:#fff}
.scale-ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--faint)}
@media (max-width:560px){.scale button{font-size:13px;padding:10px 2px}.scale button small{font-size:11px}}
.tablewrap{overflow-x:auto}
.story-res{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s5)}
.why-pick{margin-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.why-pick .mono{color:var(--muted)}
.chip.sm span{padding:6px 11px;font-size:13.5px}

/* Results: diverging bars, Writers to the left of center, Claude to the right */
.div{position:relative;height:14px;border-bottom:1px solid var(--rule)}
.div.big{height:30px}
.div i{position:absolute;top:0;bottom:0;border-inline:1px solid var(--bg)}
.div i.first{border-top-left-radius:4px;border-bottom-left-radius:4px}
.div i.last{border-top-right-radius:4px;border-bottom-right-radius:4px}
.div .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.div .d2,.sw.d2{background:var(--d2)} .div .d1,.sw.d1{background:var(--d1)} .div .same,.sw.same{background:var(--even)}
.div .c1,.sw.c1{background:var(--c1)} .div .c2,.sw.c2{background:var(--c2)}
.divcell{display:flex;flex-direction:column;gap:5px;min-width:0}
.divcell small{display:grid;grid-template-columns:1fr auto 1fr;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.divcell small span:nth-child(2){text-align:center} .divcell small span:last-child{text-align:right}
.row.thin{opacity:.45}
.axis{display:grid;grid-template-columns:1fr 1fr;font-size:12.5px;font-weight:600}
.axis span:last-child{text-align:right}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
.row.wide{grid-template-columns:2.2em minmax(0,1fr) minmax(220px,42%)}
.why{display:grid;grid-template-columns:minmax(0,1fr) 9.5em minmax(0,1fr);gap:var(--s3);align-items:center;padding-block:7px;border-bottom:1px solid var(--rule);font-size:14px}
.why .lab{text-align:center;font-weight:500}
.why .l,.why .r{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.why .l{justify-content:flex-end}
.why .l i,.why .r i{display:block;height:12px;min-width:2px}
.why .l i{background:var(--d2);border-radius:4px 0 0 4px}
.why .r i{background:var(--c2);border-radius:0 4px 4px 0}
.why.head{font-size:12.5px;font-weight:600;border-bottom:1px solid var(--ink)}
.why.head .l,.why.head .r{color:var(--ink);font-size:12.5px}
.pill.lot{font-weight:700}

<script>
const STORIES = [{"id": 316747, "h": "How Halloween became a $13 billion American extravaganza", "url": "https://news.northeastern.edu/2026/10/28/why-is-halloween-so-popular-in-america/", "v": [[{"label": "An American extravaganza:", "text": "This year, U.S. consumers are expected to spend $13.5 billion on Halloween, data reveals."}, {"label": "Halloween’s spooky origins:", "text": "The start of Halloween can be traced back to an ancient holiday marked by the Celts."}, {"label": "Rapid commercial growth:", "text": "Experts reveal how this beloved tradition took off in America in a relatively short period of time."}], [{"label": "From Celtic bonfires to front-yard skeletons:", "text": "The holiday began more than 2,000 years ago as the Celtic festival Samhain, but no country now spends more on it than the U.S."}, {"label": "An empty slot on the calendar:", "text": "With no rival holiday between back-to-school and Christmas, retailers and candy makers built a whole industry around it, a Northeastern marketing professor says."}, {"label": "Shipped back to Britain:", "text": "Films like \"E.T.\" carried the American version across the Atlantic, where it now draws more attention than Bonfire Night."}]], "d": 0, "by": "Jonathan Chadwick", "alt": "Three pumpkins, one carved with the face of a Jack-O-Lantern, in front of an orange background."}, {"id": 316993, "h": "This grad turned a gift of earrings into a business helping artisans in Latin America", "url": "https://news.northeastern.edu/2026/10/28/nouf-alawadhi-coya-jewelry/", "v": [[{"label": "From volunteer to founder:", "text": "Nouf Alawadhi's Kuwait-based online jewelry shop has topped $100,000 in sales since launching in 2017."}, {"label": "A sold-out first batch:", "text": "When a designer in Lima stopped working to care for her son, Alawadhi bought up her remaining pieces and sold every one."}, {"label": "A farm for 500 children:", "text": "A portion of sales goes back to the makers' communities, including the Peruvian orphanage where Alawadhi once taught."}], [{"label": "Who is she?", "text": "Nouf Alawadhi taught at an orphanage during a trip to Peru and wanted a way to give back."}, {"label": "How it started:", "text": "A pair of earrings that she wanted to give as a gift became the key to giving back, inspiring Alawadhi to start a business that sells jewelry from artisans in Latin America and devotes a portion of sales to community and business development projects."}, {"label": "How it’s going:", "text": "Alawadhi is being recognized for her entrepreneurialism and social commitment with a 2026 Women Who Empower Innovator Award."}]], "d": 1, "by": "Cyrus Moulton", "alt": "Nouf Alawadhi sits on a woven blanket outdoors, smiling as she talks with a group of children and adults gathered around a pile of children’s backpacks."}, {"id": 316069, "h": "We know exercise improves brain health. Now we know how", "url": "https://news.northeastern.edu/2026/10/28/how-exercise-improves-focus-research/", "v": [[{"label": "Exercise and the brain:", "text": "Researchers know that regular exercise benefits the brain by improving neural connections and changing brain structure, but the benefits of short bouts of exercise are unexplained."}, {"label": "What’s new?", "text": "Research from Northeastern University finds the system that regulates the body’s fight-or-flight response is a pathway connecting exercise and improved cognition."}, {"label": "For all ages:", "text": "The research was conducted with children, but researchers believe similar results could be applied to adults."}], [{"label": "The fight-or-flight link:", "text": "Northeastern researchers found the body's stress-response system may explain why a brisk walk sharpens children's focus."}, {"label": "Revved up, then settled:", "text": "After 20 minutes on a treadmill, a stress marker in kids' saliva spiked briefly, then dropped below resting levels as their attention steadied."}, {"label": "Walk or study before a big test?", "text": "The researchers explain when a quick stroll might help, and why it may not if you're already stressed."}]], "d": 0, "by": "Cyrus Moulton", "alt": "Silhouettes of two children running across a grassy hilltop at sunset."}, {"id": 317091, "h": "How vulnerable are the 2026 midterms to cyberattacks?", "url": "https://news.northeastern.edu/2026/10/26/2026-midterm-elections-cyberattacks/", "v": [[{"label": "What is the issue?", "text": "Foreign actors have repeatedly targeted U.S. elections, and evolving cyber threats — including those enabled by AI — raising questions about how well voting systems can withstand attacks."}, {"label": "What protects the vote?", "text": "The decentralized nature of U.S. elections makes a nationwide cyberattack more difficult, while paper records allow officials to verify electronic tallies and conduct recounts."}, {"label": "What are the vulnerabilities?", "text": "Cuts at Center for Democracy & Technology could weaken information-sharing among election officials, even as experts say years of security improvements and continued scrutiny of voting systems offer reasons for confidence."}], [{"label": "Harder to hack than you'd think:", "text": "Security experts say the patchwork of state-run voting systems and paper ballots makes U.S. elections tough to breach."}, {"label": "A paper backstop:", "text": "Over 98% of jurisdictions use equipment that leaves a paper record, which can check electronic tallies or support a recount."}, {"label": "Fewer federal defenders:", "text": "More than 1,000 staff have left the federal cyber agency that helps states guard their systems, and an expert explains where that could be felt."}]], "d": 0, "by": "Tanner Stening", "alt": "A person with a dark skin tone and glasses is hunched over a voting booth casting a ballot."}, {"id": 316959, "h": "Boston’s ‘Family & Friends Weekend’ draws loved ones from near and far", "url": "https://news.northeastern.edu/2026/10/23/family-and-friends-weekend-2026/", "v": rn Seattle’s speediest research platform", "url": "https://news.northeastern.edu/2026/10/27/self-driving-car-sensors-research/", "v": [[{"label": "10 gigabytes a minute:", "text": "The cameras, LiDAR and other sensors on Northeastern’s Ford Mustang slurp up navigation data at a hefty clip as it cruises along the Seattle streets."}, {"label": "From robotics class to Rivian:", "text": "Master’s student Vittoria Bitton, who secured a senior software engineering job at Rivian before her December graduation, mentors her robotics classmates on the Mustang’s sensor array."}, {"label": "Mistakes as curriculum:", "text": "Elvis Madiba, a former software engineer, says Li’s classroom culture of learning-through-error has him dreaming of building a similar teaching model back home in Kenya."}], [{"label": "A classroom on wheels:", "text": "Seattle students drive the sensor-loaded electric SUV around downtown, collecting 10 gigabytes of road data a minute to test their own navigation algorithms."}, {"label": "Hacking toward self-driving:", "text": "Professor Xian Li and his students are rewriting the car's steering and drive controls to push it past its hands-free highway system."}, {"label": "Guiding the visually impaired:", "text": "One student has used the same kind of navigation data to build technology that helps blind people find their way in unfamiliar places."}]], "d": 0, "by": "Peter Rubinstein", "alt": "A person wearing sunglasses sits behind the wheel of a white SUV with black wave graphics, a sensor rack mounted on its roof, and a red Northeastern “N” and the words “Autonomous Vehicle Research Platform” on the doors."}, {"id": 316007, "h": "This professor seeks to power modern society with better, safer batteries", "url": "https://news.northeastern.edu/2026/10/29/solid-state-battery-research-award/", "v": [[{"label": "A core that won't catch fire:", "text": "Northeastern engineer Hongli \"Julie\" Zhu is replacing the flammable liquid inside lithium-ion cells with a solid ceramic."}, {"label": "25,000 fires in five years:", "text": "At least that many lithium-ion fires or overheating cases were reported to federal safety regulators."}, {"label": "A top chemistry honor:", "text": "The American Chemical Society has chosen her for one of its research excellence awards in energy storage."}], [{"label": "Who is she?", "text": "Hongli \"Julie\" Zhu, an associate professor in the College of Engineering, originally wanted to be a medical doctor until her curiosity led her to science."}, {"label": "What's the issue?", "text": "Batteries are key to powering much of modern society, but many lithium-ion batteries contain an electrolyte liquid core that can sometimes catch fire."}, {"label": "Better, safer power:", "text": "Zhu wants to replace these batteries with the next generation of power storage, using her own solid-state design that won't overheat."}]], "d": 1, "by": "Rich McKay", "alt": "Hongli Zhu wearing a lab coat and black gloves connects wired battery cells at a workbench beside shelves of battery testing equipment lined with clips and cables."}, {"id": 316769, "h": "Is it anxiety, depression or something else? This research looks beyond the medical book definitions", "url": "https://news.northeastern.edu/2026/10/26/anxiety-depression-subtypes-treatment-research/", "v": [[{"label": "What is the new study?:", "text": "“Anxiety and depression subtype and their psychotherapy response,” was published recently in the peer-reviewed international medical journal, Psychological Medicine."}, {"label": "What does it say?:", "text": "It postulates that a new, holistic approach could help patients feel less distress, less impairment and bring them a higher quality of life."}, {"label": "How many people in the U.S. could it help?:", "text": "The National Institute of Mental Health reports that about 8.8% or 22.5 million American adults suffer from clinical depression and about 5% or 6.8 million Americans suffer from generalized anxiety disorder."}], [{"label": "One diagnosis, many symptoms:", "text": "A Northeastern study of more than 33,000 people seeking therapy found many have symptoms tied to several disorders at once."}, {"label": "What a single label can miss:", "text": "A racing fight-or-flight response or trouble calming down can go unnoticed when a patient gets one broad diagnosis."}, {"label": "Could therapy get more personal?", "text": "Psychologist Donald Robinaugh explains how starting from symptoms could ease distress and improve patients' quality of life."}]], "d": 0, "by": "Rich McKay", "alt": "Person in a striped shirt with eyes closed against a blue background, with motion blur creating a repeated image effect."}, {"id": 317278, "h": "Campaign ad spending is soaring. What do the big bucks actually buy you?", "url": "https://news.northeastern.edu/2026/10/28/campaign-ad-spending-is-soaring/", "v": [[{"label": "The priciest midterms ever:", "text": "Political ads this cycle are expected to cost $11.6 billion, the most in U.S. history, according to the firm AdImpact."}, {"label": "A 1% nudge:", "text": "That's roughly how much research suggests ads lift turnout, a Northeastern professor says, though it can tip a close race."}], [{"label": "Big spending:", "text": "Spending on political campaign advertisements is projected to hit a record $11.6 billion in 2026, as candidates and outside groups pour money into races across the country."}, {"label": "Will it make a difference?", "text": "Research suggests political ads can boost name recognition and sometimes sway voters, but their persuasive effects are often modest and difficult to measure. With so much ad money flooding the airwaves, experts are questioning whether campaigns are reaching new voters or simply adding to the noise."}]], "d": 1, "by": "Tanner Stening", "alt": "Elon Musk is dressed in a suit and tie, pumping both fists on stage at a political event."}, {"id": 316839, "h": "Northeastern research shows where US residents might rains still beat cars, and where Europe's signaling lags behind."}], [{"label": "A country in mourning:", "text": "Two trains collided on Wednesday in the Castilla-La Mancha region, killing 69 people and injuring over 100."}, {"label": "Another rail disaster:", "text": "It’s Spain’s second major train crash of the year – prompting safety concerns over rail systems and infrastructure."}, {"label": "Is train travel safe?", "text": "A Northeastern professor reveals if it’s still advisable to travel by train in Europe."}]], "d": 1, "by": "Jonathan Chadwick", "alt": "Overhead view of rows of sleek white high-speed trains parked side by side on empty platforms, with tall dark columns casting long shadows across the station floor."}, {"id": 316254, "h": "How studying blueberries led to an AI-powered diagnostic tool for Parkinson’s", "url": "https://news.northeastern.edu/2026/10/27/parkinsons-treatment-ai-tool/", "v": [[{"label": "From blueberries to AI tool:", "text": "Bronwyn Bridges learned of a challenge while studying antioxidant power of fruit: there weren't many neurology specialists for people in rural Canada."}, {"label": "PRIMS solution:", "text": "It's an AI-powered diagnostic tool to help clinicians assess the progression of Parkinson's disease."}, {"label": "Broad access:", "text": "Patients can guide themselves through the assessment, with rural communities or mobility issues in mind."}], [{"label": "Care without a specialist nearby:", "text": "Bronwyn Bridges built a system that scores patients’ movement with 3D imaging, so people in rural Canada aren’t stuck on long waitlists for a neurologist."}, {"label": "About 11 minutes:", "text": "That’s how long the guided assessment takes, rating speech, balance, tremors, gait and more for a clinician to review."}, {"label": "A co-founder with the disease:", "text": "Gord Genge, diagnosed in 2019, helped start the company after his own struggle to see a specialist."}]], "d": 0, "by": "Hannah Morse", "alt": "Bronwyn Bridges, dressed in bright red, poses for a portrait."}, {"id": 316909, "h": "Northeastern grad looks for love on ‘Love Is Blind’", "url": "https://news.northeastern.edu/2026/10/23/stew-love-is-blind/", "v": [[{"label": "Is love blind?", "text": "Northeastern graduate Scott Stewart was a contestant on the reality TV dating show, this year set in Boston."}, {"label": "In the public eye:", "text": "Now that the series is airing on Netflix, he's reliving the experience."}, {"label": "Lessons learned:", "text": "Stewart reflected on the experience and whether he still wants to get married."}], [{"label": "From SharkNinja to Netflix:", "text": "Engineer Scott \"Stew\" Stewart got engaged sight unseen on the reality show's Boston season, but it ended once the couple met in person."}, {"label": "Mitt Romney's double?", "text": "His fiancée made the comparison during a chaotic proposal, and Stewart says she never meant it as an insult."}, {"label": "Still ready to say \"I do\":", "text": "Stewart says he's \"absolutely committed\" to marriage and that bachelor life has lost its shine."}]], "d": 0, "by": "Hannah Morse", "alt": "Scott Stewart 'Stew' wearing a dark blazer and lavender shirt smiles broadly in front of shelves of amber wine glasses and blue plates."}, {"id": 312963, "h": "Her co-op in Greece taught this student about modern slavery", "url": "https://news.northeastern.edu/2026/10/23/co-op-greece-lessons-in-modern-slavery/", "v": [[{"label": "Tracking forced labor from Athens:", "text": "Leonie Ruehe spent her placement at a leading think tank, researching how companies can root out exploitation in their supply chains."}, {"label": "A seized passport:", "text": "Employers holding on to immigrant workers' documents is one of the clearest warning signs of trafficking, she says."}], [{"label": "Where did she work?", "text": "Leonie Ruehe, a Northeastern University student interested in global affairs, was drawn to a co-op at a think tank in Greece that conducts research into modern slavery."}, {"label": "What issues did she tackle?", "text": "Her work examined labor conditions in agriculture and other informal sectors, where workers are more likely to face exploitation and lack formal labor protections, as well as the challenges of monitoring supply chains beyond the European Union."}]], "d": 1, "by": "Tanner Stening", "alt": "A young woman with long, wavy blonde hair wearing a white cardigan works on a computer."}, {"id": 308480, "h": "Northeastern London students inspire eyewear company with ‘fresh ideas’ for US expansion", "url": "https://news.northeastern.edu/2026/10/26/pop-specs-dragons-den-students/", "v": [[{"label": "Advising a TV-backed startup:", "text": "Thirteen marketing students spent a semester studying Pop Specs, a glasses brand funded on Britain’s version of Shark Tank, then pitched its founders."}, {"label": "Glasses on wheels:", "text": "The idea that stood out most to the founders was a mobile shop modeled on a food truck."}], [{"label": "Included in their eye-popping ideas:", "text": "One student proposed that rather than pay expensive fees to set up concessions in U.S. department stores, Pop Specs could enter the American market using a mobile eyewear store modeled on a food truck."}, {"label": "Location, Location, Location:", "text": "Another student suggested the company consider Miami as a location to target, because Florida's second most populous city has an arts scene and flamboyant atmosphere that suits Pop Specs."}]], "d": 1, "by": "Matthew Ponsford", "alt": "A student holds a pair of eyeglasses up to the camera, with a small metal mechanism magnified through one lens and their smiling face blurred behind the frames."}, {"id": 316730, "h": "Why do people self-injure? It may be about mind-body boundaries", "url": "https://news.northeastern.edu/2026/10/27/why-do-people-self-harm/", "v": [[{"label": "A surprising link:", "text": "Self-injury may be tied to something people rarely question — how separate your mind feels from your body."}, {"label": "Uncertainty hurts:", "text": "Researchers suggest self-injury may give otherwise hard-to-identify emotional pain a concrete, recognizable form."}, {"label": "Finding a way in:", "text": "Understanding that struggle could help therapists reach patients who find it difficult to explain what they’re going through."}], [{"label": "No line between feeling and flesh:", "text": "People who hurt themselves more often tend to see emotions and the body as made of the same stuff, a Northeastern study finds."}, {"label": "Pain with no name:", "text": "Blurring the two can leave emotional distress hard to pin down, and an injury gives it something concrete, says psychologist Iris Berent."}, {"label": "A new lead for therapists:", "text": "The finding could help clinicians teach patients to tell bodily signals apart from emotions and name what they feel."}]], "d": 0, "by": "Katya Poltorak", "alt": "A figure with long dark hair sits curled up, knees to chest and head bowed, as green vines grow up and around their body under a pale full moon, with a golden butterfly and falling leaves against a deep blue night sky."}];

  $("count").textContent = `${graded()} / ${N}`;
}

function list(bs){ return bs.map(b => `<li><b>${esc(b.label)}</b> ${esc(b.text)}</li>`).join(""); }

function renderGrade(){

// After submitting, each story shows how the team voted on it, so you can compare the two sets with the verdict in view.
function storyResults(s){
  if(team === null) return `<section class="story-res"><p class="empty">${teamErr || "Loading the team’s votes…"}</p></section>`;
  const ps = votesOn(s), t = tally(ps.map(x => x.r)), n = counted(t);
  const why = {desk:{}, claude:{}};
  ps.forEach(x => { const r = pref(s, x.d.picks[s.id]); if(why[r]) reasonsOf(x.d, s).forEach(k => why[r][k] = (why[r][k]||0) + 1); });
  const wmax = Math.max(1, ...REASONS.flatMap(r => [why.desk[r]||0, why.claude[r]||0]));
  const anyWhy = REASONS.some(r => why.desk[r] || why.claude[r]);
  return `<section class="story-res">
    <div class="section-h"><h3>How the team voted</h3><span class="hint">${n} ${n===1?"vote":"votes"}${state.picks[s.id] ? ` · you: ${LVL_LABEL[lvl(s, state.picks[s.id])]}` : ""}</span></div>
    ${divbar(t, true)}
    ${anyWhy ? `<div><div class="why head"><span class="l">For the writers</span><span class="lab"></span><span class="r">For Claude</span></div>
      ${REASONS.filter(r => why.desk[r] || why.claude[r]).map(r => { const a = why.desk[r]||0, b = why.claude[r]||0; return `<div class="why"><span class="l">${a}<i style="width:${a/wmax*80}%"></i></span><span class="lab">${esc(r)}</span><span class="r"><i style="width:${b/wmax*80}%"></i>${b}</span></div>`; }).join("")}</div>` : ""}
    <div class="tablewrap">${voteTable(s, ps)}</div>
  </section>`;
}

function tally(rows){
  const t = {d2:0, d1:0, same:0, c1:0, c2:0};
  rows.forEach(r => { if(r in t) t[r]++; });
  t.desk = t.d2 + t.d1; t.claude = t.c2 + t.c1; return t;
}
const counted = t => t.desk + t.same + t.claude;
const pct = (n, of) => of ? Math.round(n/of*100) + "%" : "–";
const SEGS = ["d2","d1","same","c1","c2"];
// Diverging bar: center line = even split; Writers grows left, Claude grows right; each half spans 100% of votes.
function divbar(t, big){
  const n = counted(t);
  const w = k => n ? t[k]/n*50 : 0;
  let x = 50 - (w("d2") + w("d1") + w("same")/2);
  const on = SEGS.filter(k => t[k]);
  const segs = on.map((k,j) => { const s = `<i class="${k} ${j===0?"first":""} ${j===on.length-1?"last":""}" style="left:${x}%;width:${w(k)}%" title="${LVL_LABEL[k]}: ${t[k]} (${pct(t[k],n)})"></i>`; x += w(k); return s; });
  return `<div class="divcell"><div class="div ${big?"big":""}" role="img" aria-label="${SEGS.map(k => `${LVL_LABEL[k]} ${t[k]}`).join(", ")}">${segs.join("")}<b class="mid"></b></div>
    <small><span>Writers ${pct(t.desk,n)}</span><span>${t.same ? "Even " + pct(t.same,n) : ""}</span><span>Claude ${pct(t.claude,n)}</span></small></div>`;
}
const legend = `<div class="legend">${SEGS.map(k => `<span><i class="sw ${k}"></i>${LVL_LABEL[k]}</span>`).join("")}</div>`;
const pill = r => r ? `<span class="pill ${r[0]==="d"?"desk":r[0]==="c"?"claude":r} ${/2$/.test(r)?"lot":""}">${LVL_LABEL[r]}</span>` : `<span class="hint">–</span>`;
const nameOf = d => d.name || "Unnamed";
const reasonsOf = (d, s) => (d.reasons?.[s.id] || []).filter(r => REASONS.includes(r));
const votesOn = s => (team || []).map(d => d.picks?.[s.id] ? {d, r:lvl(s, d.picks[s.id])} : null).filter(Boolean)
  .sort((a,b) => nameOf(a.d).localeCompare(nameOf(b.d)));
const voteTable = (s, ps) => ps.length ? `<table class="ptable"><thead><tr><th>Name</th><th>Team</th><th>Picked</th><th>Why</th><th>Note</th></tr></thead><tbody>${ps.map(x => `<tr><td>${esc(nameOf(x.d))}</td><td>${esc(x.d.team||"")}</td><td>${pill(x.r)}</td><td>${esc(reasonsOf(x.d, s).join(", "))}</td><td>${esc(x.d.notes?.[s.id]||"")}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No votes yet.</p>`;
const TEAMS = ["Editor", "Writer", "Digital", "Media Relations", "Social Media", "Photo/Video", "Other"];
const MIN_N = 3; // groups smaller than this are shown faded: too few people to read a split from

function renderDash(){

  const why = {desk:{}, claude:{}};

  const wmax = Math.max(1, ...REASONS.flatMap(r => [why.desk[r]||0, why.claude[r]||0]));

      <div class="score">

        <div><strong>${pct(all.claude, counted(all))}</strong><span>${all.claude} picks for Claude · ${all.c2} by a lot</span></div>

      <div class="rows">${byTeam.map(x => `<div class="row wide ${x.n<MIN_N?"thin":""}"><span class="n">${x.n}</span><span class="h">${esc(x.tm)}<small>${x.n} ${x.n===1?"person":"people"} · ${counted(x.t)} votes</small></span>${divbar(x.t)}</div>`).join("")}</div></section>` : ""}
    ${anyWhy ? `<section><div class="section-h"><h3>Why people picked a side</h3><span class="hint">Times each reason was given</span></div>
      <div><div class="why head"><span class="l">For the writers</span><span class="lab"></span><span class="r">For Claude</span></div>
      ${REASONS.map(r => { const a = why.desk[r]||0, b = why.claude[r]||0; return `<div class="why"><span class="l">${a}<i style="width:${a/wmax*80}%"></i></span><span class="lab">${esc(r)}</span><span class="r"><i style="width:${b/wmax*80}%"></i>${b}</span></div>`; }).join("")}</div></section>` : ""}
    <section>
      <div class="section-h"><h3>By story</h3><span class="hint">Click a story for names, reasons and notes</span></div>
      <div class="axis"><span>← Preferred the writers</span><span>Preferred Claude →</span></div>
      <div class="rows">${STORIES.map((s,i) => { const ps = votesOn(s); const t = tally(ps.map(x => x.r)), n = counted(t), sk = ps.filter(x => x.r==="skip").length;
        const notes = ps.filter(x => (x.d.notes?.[s.id]||"").trim()).length;
        return `<details class="xrow"><summary class="row wide ${n<MIN_N?"thin":""}"><span class="n">${two(i+1)}</span><span class="h">${esc(s.h)}<small>${n} ${n===1?"vote":"votes"}${sk?` · ${sk} skipped`:""}${notes?` · ${notes} ${notes===1?"note":"notes"}`:""}</small></span>${divbar(t)}</summary>
          <div class="xbody">${voteTable(s, ps)}</div></details>`; }).join("")}</div>
    </section>
    <section>
      <div class="section-h"><h3>By person</h3><span class="hint">Click a name for every pick and note</span></div>
      ${people.length ? `<div class="rows">${people.map(d => { const rs = rowsOf(d), t = tally(rs), g = rs.filter(Boolean).length;
        return `<details class="xrow"><summary class="row wide"><span class="n">${d.done?"✓":g}</span><span class="h">${esc(nameOf(d))}${d.team?` <span class="team">${esc(d.team)}</span>`:""}<small>${d.done?"Finished":g+" of "+N+" graded"}</small></span>${divbar(t)}</summary>
          <div class="xbody"><table class="ptable"><thead><tr><th>Story</th><th>Picked</th><th>Why</th><th>Note</th></tr></thead><tbody>${STORIES.map((s,i) => `<tr><td>${two(i+1)} ${esc(s.h)}</td><td>${pill(rs[i])}</td><td>${esc(reasonsOf(d, s).join(", "))}</td><td>${esc(d.notes?.[s.id]||"")}</td></tr>`).join("")}</tbody></table></div></details>`; }).join("")}</div>` : `<p class="empty">No one has graded yet.</p>`}
    </section>
  </div>`;
}

function render(){
  renderTicks();
  $("who").hidden = !state.name; $("who").textContent = state.team ? state.name + " · " + state.team : state.name;
  $("admin").hidden = !state.name; $("admin").setAttribute("aria-pressed", state.mode === "results");
  state.mode === "results" ? renderDash() : renderGrade();
}

function setStatus(t){ const el = $("status"); if(el) el.textContent = t; }
let saveTimer = null, inflight = null, again = false;
async function post(){
  const body = {id:gid, name:state.name, team:state.team, done:state.done, picks:state.picks, notes:state.notes, reasons:state.reasons,
    headers: STORIES.flatMap((s,i) => [`${two(i+1)} ${s.h}`, `${two(i+1)} note`]),
    summary: STORIES.map(s => [state.picks[s.id] ? [LVL_LABEL[lvl(s, state.picks[s.id])], ...(state.reasons[s.id]||[])].join(" · ") : "", state.notes[s.id] || ""])};
  try{
    // A request that never answers would hold the queue forever and silently stop every later save.
    const r = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify(body), signal:AbortSignal.timeout(20000)});
    const j = await r.json(); if(!j.ok) throw new Error(j.error || "rejected");
    setStatus("Saved");
  }catch(e){
    setStatus("Couldn’t save yet. Your picks are kept in this browser; retrying…");
    // ponytail: fixed 10 s retry while the page is open; backoff if Google starts rate-limiting
    clearTimeout(saveTimer); saveTimer = setTimeout(run, 10000);
  }
}
// Apps Script drops overlapping requests, so one save runs at a time; picks made meanwhile ride the next one.
function run(){
  if(!/^https?:\/\//.test(SCRIPT_URL)){ setStatus("Not saving yet: the results sheet isn’t connected."); return; }
  if(inflight){ again = true; return inflight; }
  inflight = (async () => { do { again = false; await post(); } while(again); })().finally(() => { inflight = null; });
  return inflight;
}
async function save(now){
  clearTimeout(saveTimer);
  if(now) return run();
  saveTimer = setTimeout(run, 900);
}

async function loadTeam(){
  if(!/^https?:\/\//.test(SCRIPT_URL)){ team = []; teamErr = "The results sheet isn’t connected yet."; return; }
  try{
    const j = await (await fetch(SCRIPT_URL, {signal:AbortSignal.timeout(20000)})).json();
    team = (j.rows || []).map(r => ({...r, _id:r.key}));
    // Show this browser's latest picks even if the sheet hasn't caught up.
    const me = team.find(r => r.key === myKey);
    if(me){ Object.assign(me, {name:state.name, team:state.team, picks:{...state.picks}, notes:{...state.notes}, reasons:{...state.reasons}, done:state.done}); }
    else if(state.name && graded()) team.push({key:myKey, _id:myKey, name:state.name, team:state.team, picks:{...state.picks}, notes:{...state.notes}, reasons:{...state.reasons}, done:state.done});
    teamErr = "";
  }catch(e){ team = null; teamErr = "Couldn’t load results. Check your connection and refresh."; }
}

function keepLocal(){ try{ localStorage.setItem("grader-state", JSON.stringify({picks:state.picks, notes:state.notes, reasons:state.reasons, done:state.done})); }catch(_){} }
function go(i){ state.cur = Math.max(0, Math.min(N-1, i)); state.mode = "grade"; render(); window.scrollTo({top:0, behavior:"auto"});
  if(state.done && team === null && !teamErr) loadTeam().then(render); }
function pick(k){
  if(state.done) return;
  if(!state.name || !state.team){ openHowto(); return; }
  const id = STORIES[state.cur].id;
  if(side(k) !== side(state.picks[id])) delete state.reasons[id];
  state.picks[id] = k; keepLocal(); render(); save(true);
}

document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]"); if(g){ go(+g.dataset.go); return; }
  if(e.target.closest("a")) return;
  const p = e.target.closest("[data-pick]"); if(p){ pick(p.dataset.pick); return; }
  // Clicking a version leans a bit toward it, unless it's already the chosen side.
  const c = e.target.closest("[data-card]"); if(c){ if(side(state.picks[STORIES[state.cur].id]) !== c.dataset.card) pick(c.dataset.card + "1"); return; }
  const id = e.target.closest("button")?.id;
  if(id === "prev") go(state.cur-1);
  if(id === "next"){ const nxt = STORIES.findIndex((s,i) => i > state.cur && !state.picks[s.id]); const any = STORIES.findIndex(s => !state.picks[s.id]); go(nxt !== -1 ? nxt : any !== -1 ? any : state.cur); }
  if(id === "submit"){ state.done = true; keepLocal(); state.mode = "results"; render(); await save(true); await loadTeam(); render(); window.scrollTo({top:0}); }
  if(id === "toresults"){ state.mode = "results"; team = null; render(); await loadTeam(); render(); window.scrollTo({top:0}); }
  if(id === "refresh"){ team = null; render(); await loadTeam(); render(); }
  if(id === "admin"){ state.mode = "results"; team = null; render(); await loadTeam(); render(); window.scrollTo({top:0}); }
  if(id === "who"){ openHowto(); }
});
document.addEventListener("input", e => {
  if(e.target.dataset.reason){ const id = STORIES[state.cur].id, r = e.target.dataset.reason, cur = state.reasons[id] || [];
    state.reasons[id] = e.target.checked ? [...cur.filter(x => x !== r), r] : cur.filter(x => x !== r);
    if(!state.reasons[id].length) delete state.reasons[id]; keepLocal(); save(false); return; }
  if(e.target.id === "note"){ state.notes[STORIES[state.cur].id] = e.target.value; keepLocal(); save(false); }
});
document.addEventListener("keydown", e => {
  if(e.target.closest("textarea,input") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(state.mode !== "grade") return;
  if(k === "a") pick("A1"); else if(k === "b") pick("B1"); else if(k === "e") pick("same");
  else if(/^[1-5]$/.test(k)) pick(SCALE[+k-1][0]);
  else if(e.key === "ArrowRight") go(state.cur+1); else if(e.key === "ArrowLeft") go(state.cur-1);
});

function openHowto(){ $("grader-name").value = state.name; document.querySelectorAll('input[name="team"]').forEach(r => r.checked = r.value === state.team); const d = $("howto"); if(!d.open){ try{ d.showModal(); }catch(_){ d.setAttribute("open",""); } } $("grader-name").focus(); }
function closeHowto(){ const d = $("howto"); try{ d.close(); }catch(_){ d.removeAttribute("open"); } }
$("howto").addEventListener("cancel", e => { if(!state.name || !state.team) e.preventDefault(); });
$("howto-form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("grader-name").value.trim().replace(/\s+/g," ").slice(0,80);
  const tm = document.querySelector('input[name="team"]:checked')?.value || "";
  $("name-err").hidden = !!v; $("team-err").hidden = !!tm;
  if(!v){ $("grader-name").focus(); return; } if(!tm) return;
  state.name = v; state.team = tm; try{ localStorage.setItem("grader-name", v); localStorage.setItem("grader-team", tm); }catch(_){}
  closeHowto(); render(); save(true);
});
try{ state.name = localStorage.getItem("grader-name") || ""; state.team = localStorage.getItem("grader-team") || ""; }catch(_){}
render();
if(!state.name || !state.team) openHowto();
(async () => {
  isOwner = location.hash === "#results";
  try{
    const s = JSON.parse(localStorage.getItem("grader-state") || "null");
    if(s && typeof s === "object"){ Object.assign(state.picks, s.picks || {}); Object.assign(state.notes, s.notes || {}); Object.assign(state.reasons, s.reasons || {}); state.done = !!s.done && graded() === N; }
  }catch(_){}
  myKey = await sha256(gid);
  if(state.done || isOwner){ state.mode = "results"; render(); await loadTeam(); }
  else { const n = STORIES.findIndex(s => !state.picks[s.id]); state.cur = n === -1 ? N-1 : n; }
  render();
  // Re-send what this browser holds, so picks a failed save missed reach the sheet on the next visit.
  if(state.name && graded()) save(true);
  setStatus(!/^https?:\/\//.test(SCRIPT_URL) ? "Not saving yet: the results sheet isn’t connected." : graded() ? "Picks restored" : "Picks save as you go");
})();
</script>
